<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="./assets/img/4geeks.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Generator</title>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.2.0/css/all.css"
    integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ" crossorigin="anonymous" />
</head>

<body class="bg-success min-vh-100 d-flex justify-content-center align-items-center">
  <main class="d-flex flex-column align-items-center gap-4">
    <div class="card playing-card shadow-lg rounded-4 border-0">
      <div class="card-body d-flex flex-column justify-content-between p-3">
        <div id="topSuit" class="card-suit align-self-start"></div>

        <div class="text-center">
          <span id="cardValue" class="card-value"></span>
        </div>

        <div id="bottomSuit" class="card-suit bottom-suit align-self-end"></div>
      </div>
    </div>

    <button id="generateCardButton" class="btn btn-light shadow">
      <span class="text-uppercase">new card</span>
    </button>

  </main>



  <script type="module" src="./app.js"></script>
</body>

</html>
